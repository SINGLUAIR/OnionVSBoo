<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>イビルライトフォース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261124a">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- タイトル画面 -->
  <div id="title-screen" class="screen active">
    <!-- タイトルロゴ：assets/ui-config.js の titleLogo.src に画像を設定すると、文字の代わりに画像が出ます -->
    <div id="title-logo" class="title-logo">
      <img id="title-logo-img" class="title-logo-img" alt="" hidden>
      <h1 class="game-title title-logo-text">イビルライトフォース</h1>
    </div>
    <p class="subtitle"><span class="orn">✦</span> 自分のキャラと相手を選んでください <span class="orn">✦</span></p>
    <!-- キャラ選択ボタンは assets/config.js の characters から自動で作られます（js/game.js の buildSelect） -->
    <div class="select-wrap">
      <div class="select-side">
        <div class="select-label">あなた</div>
        <div class="char-select" data-side="player"></div>
      </div>
      <div class="select-vs">VS</div>
      <div class="select-side">
        <div class="select-label">あいて</div>
        <div class="char-select" data-side="opponent"></div>
      </div>
    </div>
    <button id="start-btn" class="main-btn"><span>バトル開始</span></button>
    <div class="controls-help">
      <p><b>スマホ（横画面）</b>：フリック／スワイプで移動・タップで攻撃・勢いよくフリックで回避</p>
      <p><b>PC</b>：W A S D で移動・Enter で攻撃・Shift＋方向で回避（H：当たり判定表示）／選択：A D で自分・← → で相手</p>
    </div>
    <button id="fullscreen-btn" class="sub-btn small">全画面にする</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="screen">
    <div class="result-panel">
    <h2 id="result-text" class="result-text">勝利！</h2>
    <p id="result-detail" class="result-detail"></p>
    <div class="result-buttons">
      <button id="retry-btn" class="main-btn"><span>もう一度</span></button>
      <button id="title-btn" class="sub-btn"><span>タイトルへ</span></button>
    </div>
    </div>
  </div>
</div>

<!-- 縦画面のときの案内 -->
<div id="rotate-hint">
  <div class="rotate-icon">📱</div>
  <p>スマホを横向きにしてください</p>
</div>

<script src="assets/config.js?v=20261124a"></script>
<script src="assets/ui-config.js?v=20261124a"></script>
<script src="js/config.js?v=20261124a"></script>
<script src="js/sprites.js?v=20261124a"></script>
<script src="js/input.js?v=20261124a"></script>
<script src="js/game.js?v=20261124a"></script>
<script src="js/ui.js?v=20261124a"></script>
</body>
</html>

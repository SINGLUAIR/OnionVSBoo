<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>天使 vs ルシファー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- タイトル画面 -->
  <div id="title-screen" class="screen active">
    <h1 class="game-title">天使 <span>vs</span> 堕天使ルシファー</h1>
    <p class="subtitle">使うキャラクターを選んでください</p>
    <div class="char-select">
      <button class="char-btn angel selected" data-char="angel">
        <span class="char-icon"></span>
        <span class="char-name">天使</span>
        <span class="char-note">ライフ2以下で<br>速度アップ</span>
      </button>
      <button class="char-btn lucifer" data-char="lucifer">
        <span class="char-icon"></span>
        <span class="char-name">堕天使ルシファー</span>
        <span class="char-note">ライフ4以上で<br>速度アップ</span>
      </button>
    </div>
    <button id="start-btn" class="main-btn">バトル開始</button>
    <div class="controls-help">
      <p><b>スマホ（横画面）</b>：フリック／スワイプで移動・タップで攻撃</p>
      <p><b>PC</b>：W A S D で移動・Enter で攻撃（H：当たり判定表示）</p>
    </div>
    <button id="fullscreen-btn" class="sub-btn small">全画面にする</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="screen">
    <h2 id="result-text" class="result-text">勝利！</h2>
    <p id="result-detail" class="result-detail"></p>
    <div class="result-buttons">
      <button id="retry-btn" class="main-btn">もう一度</button>
      <button id="title-btn" class="sub-btn">タイトルへ</button>
    </div>
  </div>
</div>

<!-- 縦画面のときの案内 -->
<div id="rotate-hint">
  <div class="rotate-icon">📱</div>
  <p>スマホを横向きにしてください</p>
</div>

<script src="assets/config.js"></script>
<script src="js/config.js"></script>
<script src="js/sprites.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
</body>
</html>
